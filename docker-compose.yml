services:
  repo-tts-api:
    build: .
    container_name: repo-tts-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ESPEAK_PATH=espeak-ng
    restart: unless-stopped

  repo-tts-bot:
    build: .
    container_name: repo-tts-bot
    env_file:
      - .env
    environment:
      - ESPEAK_PATH=espeak-ng
    command: python repo_tts_bot.py
    depends_on:
      - repo-tts-api
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: repo-tts-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - repo-tts-api
    restart: unless-stopped
