services:
  # ── API + Frontend ──────────────────────────────────────────
  - type: web
    name: repo-tts-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /status
    envVars:
      - key: ESPEAK_PATH
        value: espeak-ng

  # ── Discord bot (worker: no expone puerto, corre 24/7) ──────
  - type: worker
    name: repo-tts-bot
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python repo_tts_bot.py
    plan: free
    envVars:
      - key: ESPEAK_PATH
        value: espeak-ng
      - key: DISCORD_TOKEN
        sync: false  # se configura manualmente en el dashboard de Render
